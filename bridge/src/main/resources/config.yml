# VTpaBridge（子服端）
#
# channel: 跟代理端 config.toml 里的 bridge.channel 必须一模一样 ——
#   代理那边改了，这里也要跟着改（两边都要重启）。对不上就是两边各说各话：
#   子服收不到代理的问话，代理也永远等不到回包（表现为「传送没反应」）。
channel: vtpa:main
#
# debug: true 才打印排查用的细节日志（开始盯谁的移动、谁动了要上报…）。
#   默认关 —— 平时控制台干干净净，出问题了开一下、复现一次、再关掉。
#   ⚠️ 改完要重启这个子服才生效（子服端没有 reload 命令）。
debug: false
