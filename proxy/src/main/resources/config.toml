# ============================================================
#  VTpa —— 跨服传送请求配置（Velocity 代理端）
#  改完之后：游戏内敲 /vtpa reload（需要 vtpa.reload 权限），
#            或者在控制台直接敲 /vtpa reload
#  ⚠️ 写在 # 后面的是注释。注意：没加引号的值不要在同一行再写 # 注释。
# ============================================================

# ------------------------------------------------------------
# 服务器名单：哪些子服能用传送请求
#   blacklist = 名单里的服不能用（默认，空名单 = 全都行）
#   whitelist = 只有名单里的服能用（空名单 = 全服都不能用，慎用）
# 服名写 velocity.toml 的 [servers] 里的名字，大小写不敏感
#
# 判定是「双向」的：发起者所在的服 和 目标所在的服 都得通过，
# 只要有一边不在名单里，这个请求就发不出去（提示语见 messages.server-denied-*）。
# 例：想让起床服完全隔离 → mode = "blacklist"、list = ["bedwars"]
# ------------------------------------------------------------
[servers]
mode = "blacklist"
list = []

# ------------------------------------------------------------
# 权限：没在 LuckPerms 里配过的权限节点算不算有？
#   true  = 基础节点（use / here / accept / deny / cancel / toggle）默认人人可用
#   false = 必须去 LuckPerms 显式给，不给就发不出请求
# ⚠️ 特权节点不受这一项影响，一律要显式给：
#   vtpa.all（/tpaall）、vtpa.server、vtpa.world、vtpa.reload、各种 bypass
# ⚠️ 移动取消【不】看权限：倒计时期间谁动了都取消，OP / 管理员也不例外，
#    没有任何节点能绕过。想整服关掉只能改下面的 movement.enabled = false。
# ------------------------------------------------------------
[permissions]
allow-by-default = true

# ------------------------------------------------------------
# 基本规则
#   request-timeout-seconds   请求多久没人理就自动作废（默认 180 秒 = 3 分钟）
#   teleport-delay-seconds    对方同意之后，倒计多少秒才真正传送（默认 3 秒）
#   cooldown-seconds          两次发起请求之间隔多久（秒）。0 = 不限
#   max-outgoing-requests     一个人最多同时挂着几个「已发出、还没被处理」的请求
#   allow-cross-server        允许跨服请求（A 在生存、B 在生电也算）
#   allow-same-server         允许同服请求（两人在同一个子服）
#   notify-on-expire          请求过期时通知双方
#   notify-on-disconnect      请求未处理、当事人掉线时通知另一方
#   reverse-auto-accept       「互相请求」直接同意（默认开）：
#                             A 给 B 发了个请求还没处理，B 反过来又发一条 ——
#                             只要两条的「结果」一样（动的是同一个人、落点也是同一个人），
#                             就当双方都同意了，直接进倒计时，不用再点一次接受。
#                               ✅ A 敲 /tpa B（想去 B 那儿）→ B 敲 /tpahere A（叫 A 过来）
#                                  两条都是「A 传送到 B」→ 自动同意
#                               ❌ A 敲 /tpa B → B 也敲 /tpa A（B 想去 A 那儿）
#                                  结果正好相反 → 不自动同意，B 会收到「已经给你发过请求了」
#                             ⚠️ 只对单人的 /tpa /tpahere 生效，/tpaall 那类群发不算
#                                （群发里忽然把人传走太突然，还是让对方自己点）
# ------------------------------------------------------------
[general]
request-timeout-seconds = 180
teleport-delay-seconds = 3
cooldown-seconds = 5
max-outgoing-requests = 3
allow-cross-server = true
allow-same-server = true
notify-on-expire = true
notify-on-disconnect = true
reverse-auto-accept = true

# ------------------------------------------------------------
# 同意之后的倒计时显示
#   enabled = false 就不显示（但延迟照旧）
#   mode    = title（屏幕正中大字）/ actionbar（物品栏上方）/ both / none
# 占位符：#seconds# = 还剩几秒，#player# = 另一方名字，#server# = 目标服
# ------------------------------------------------------------
[countdown]
enabled = true
mode = "title"
title = "&6传送中"
subtitle = "&7等待 &c#seconds# &7秒"
actionbar = "&c#seconds# &7秒后传送到 &6#player# &7，请不要移动"
fade-in-ticks = 2
stay-ticks = 20
fade-out-ticks = 4

# ------------------------------------------------------------
# 粒子特效（移植自 CMI 的 tpaWarmup / TeleportEffects）
#
#   写法跟 CMI 的 Settings/ParticleEffects.yml 一模一样，用 ; 分隔：
#     effect   粒子名（flying_glyph 符文 / reddust 红石粉 / heart 爱心 / crit / flame / portal …）
#     c       颜色 "r,g,b"；写 rs 是彩虹色
#     part    每一圈撒几个粒子      radius/r  半径（格）
#     offset  相对玩家的偏移 x,y,z  move      每 tick 漂移（"0,0.33,0" = 往上冲的光柱）
#     pitch   环的朝向（90 = 水平环，套在玩家身上那种）
#     yawc    每 tick 转多少度（环就转起来了）
#     dur     时长（秒）；关键字 twist = 扭转、static = 钉在原地不跟人
#   上面那三串就是 CMI 默认文件里 tpaWarmup / TpUp / TpDown 的原值，照抄即可。
#
#   ⚠️ 特效是子服（VTpaBridge）撒的，代理撒不了粒子。子服没装桥接就不会有效果，
#      但传送本身照常 —— 特效永远不影响能不能传。
# ------------------------------------------------------------
[particles]
enabled = true
# 只给确认装了桥接的子服发特效；false = 不管有没有装都发（白发而已，无害）
require-bridge = true
# 倒计时期间在被传送那个人身上一直转的（CMI 的 tpaWarmup）
countdown = "circle;effect:flying_glyph;dur:5;pitchc:15;part:10;offset:0,1.7,0;radius:0.5;yawc:12;color:rs;pitch:90"
# 传送那一瞬间在出发地撒的（CMI 的 TpUp）
depart = "circle;c:200,50,210;twist;part:5;r:0.5;pitch:90;move:0,0.33,0;offset:0,-0.2,0"
# 落地那一瞬间在落点撒的（CMI 的 TpDown）
arrive = "circle;c:150,50,10;part:5;r:0.5;pitch:90;move:0,-0.33,0;offset:0,2.2,0"
# 倒计时被打断（移动了 / 取消了 / 失败）时撒一下；空串 = 不播
cancel = ""
# 时长（tick，20 = 1 秒）。countdown 不用管，自动按倒计时秒数算。
depart-ticks = 15
arrive-ticks = 15
cancel-ticks = 10
# 一个人身上最多同时挂几段特效，超了先掐掉最老的（防刷屏卡顿）
max-per-player = 4

# ------------------------------------------------------------
# 「倒计时期间玩家移动了就作废」的检测
#   enabled            总开关。关掉 = 「随便动，照样传送」。
#   backend-detection  让子服盯（默认，推荐）—— 子服监听 PlayerMoveEvent，
#                      每动一下立刻知道，实时又准，跟 CMI 一个路子。
#                      ⚠️ 需要子服桥接 ≥ 1.1.0，更老的会自动退回下面的轮询。
#   backend-and-poll    子服已经在盯了，代理要不要「同时」再轮询一遍（默认 true）。
#                       双保险：子服那条路万一没走通（消息丢了、子服没装、版本不认），
#                       移动取消会静默失效 —— 玩家动了照样传走，还特别难查。
#                       多问几次坐标很便宜，所以默认两条一起上。想省这点开销就改 false。
#   tolerance          离「倒计时开始那一刻站的点」偏出多少方块算「动了」
#                      ★ 默认 0.0 = 动一下就取消，跟线上 CMI（Tpa.Move: false）一个体感。
#                        （CMI 的真实判据其实是「前一帧和这一帧的方块格不同了」，
#                         0.0 比它还干脆：连格子里的微动、被水冲一下都算动。）
#                        想放宽就调大：0.6 = 走小半格才取消，2 = 走两步才取消。
#   ignore-y           只算水平距离（原地跳一下、被活塞顶一下就不算动）
#                      ★ 默认 false = 竖直方向动了也算，跳一下就取消 —— 跟 CMI 一致。
#   poll-interval-millis 退回代理轮询时多久问一次坐标（默认 250 毫秒）
#                      轮询慢半拍（还有一次网络往返），只在桥接太老时才走这条路。
#   cancel-on-world-change 换了世界（比如被别的插件传走）直接作废
#   ⚠️ 子服没装桥接时这一项自动失效（等于不检测）—— 宁可不拦，也不误判。
#   ℹ️ 只转视角（光转头、没挪窝）不算动 —— CMI 也是这么判的。
# ------------------------------------------------------------
[movement]
enabled = true
backend-detection = true
backend-and-poll = true
tolerance = 0.0
ignore-y = false
poll-interval-millis = 250
cancel-on-world-change = true

# ------------------------------------------------------------
# 声音。格式跟 CMI 的 Sounds 段一模一样：名字:音量:音调
#   写空串（""）就是「这个不播」。可用的名字参考 Bukkit Sound 枚举，
#   下划线和点都认（block_anvil_land = block.anvil.land）。
#   下面这几个默认值就是线上 CMI 现在用的那几个。
#   request        对方收到请求时（播给被请求的人）
#   countdown      倒计时开始（播给被传送的人）
#   countdown-tick 倒计时每过一秒滴一下
#   depart         出发那一瞬间
#   arrive         落地那一瞬间
#   cancel         倒计时被打断
#   deny           请求被拒绝（播给发起者）
#   fail           传送失败
# ------------------------------------------------------------
[sounds]
enabled = true
request = "block_anvil_land:0.5:2"
countdown = "blockrespawnanchorcharge:1:1"
countdown-tick = "blockrespawnanchorcharge:1:1"
depart = "entity_enderman_teleport:2:1"
arrive = "entity_enderman_teleport:0.2:1"
cancel = ""
deny = ""
fail = "entity_villager_no:2:1"

# ------------------------------------------------------------
# 发给被请求者的那条消息（最后两个 #accept# / #deny# 会变成可点击的按钮）
# 占位符：
#   %player%（也认 #player#）= 发起请求的人
#   %server%（也认 #server#）= 发起请求的人所在的服
#   %time%                   = 这个请求还剩多少秒失效
#   #accept# / #deny#        = 接受 / 拒绝按钮（具体长啥样在 [buttons] 里配）
# ------------------------------------------------------------
[request]
tpa = "&6%player% &e请求传送到你这里! #accept# #deny#"
here = "&6%player% &e请求你传送到他那里! #accept# #deny#"

# ------------------------------------------------------------
# 按钮长什么样
#   *-text     按钮上显示的文字
#   *-hover    鼠标悬停时显示的文字（写 \n 换行）
#   *-command  点一下会执行什么（%player% 换成对方的名字，
#              所以带名字的 /tpaccept 能精确对上那一条请求，不怕同时有多个）
#
# cancel-* 是发给发起者那条「已发送请求」里的撤回按钮（在 messages.request-sent
# 里写 #cancel# 就会出现）。注意那条消息里 %player% 指的是「被请求的人」——
# 因为撤回要说清楚撤回发给谁的那个。
# ------------------------------------------------------------
[buttons]
accept-text = "&a&l[✔]"
accept-hover = "&aAccept"
accept-command = "/tpaccept %player%"
deny-text = "&c&l[X]"
deny-hover = "&cDeny"
deny-command = "/tpadeny %player%"
cancel-text = "&7&l[X]"
cancel-hover = "&aCancel"
cancel-command = "/tpacancel %player%"

# ------------------------------------------------------------
# 各种提示语。占位符会被自动替换，每条前面会自动拼上下面的 prefix
#   #player#  另一方名字      #target#   目标玩家名字
#   #server#  服务器名        #seconds#  秒数
#   #amount# / #skipped#     /tpaall 发出去多少、跳过了多少
#   #max#     上限            #reason#   失败原因
#   #label#   玩家实际敲的命令（走 /tpa 就是 /tpa，走 /vtpa tpa 就是 /vtpa tpa）
# ------------------------------------------------------------
[messages]
prefix = ""
no-permission = "&c你没有权限这么做"
players-only = "&c这条命令只有玩家能用"
unknown-subcommand = "&c不存在 &7#sub# &c这个子命令，输入 &f#label# &c查看命令列表"
usage-tpa = "&7用法：&f#label# <玩家>"
usage-tpaccept = "&7用法：&f#label# [玩家]"
usage-tpadeny = "&7用法：&f#label# [玩家]"
usage-tpacancel = "&7用法：&f#label# [玩家]"
usage-tpaall = "&7用法：&f#label#"
usage-tpaworld = "&7用法：&f#label#"
usage-tpaserver = "&7用法：&f#label#"
usage-tpatoggle = "&7用法：&f#label# [on|off]"
player-not-found = "&c找不到在线玩家 &6#target#&c"
ambiguous-target = "&6#target# &e有多个人名匹配，多打几个字"
target-connecting = "&6#target# &e还在登录中，请稍后重试"
self-request = "&c不能向自己发送传送请求"
cooldown = "&e慢一点，还要 &6#seconds# &c秒"
server-denied-self = "&e你所在的服务器 &6#server# &e不能使用传送请求"
server-denied-target = "&6#target# &e所在的服务器不能使用传送请求"
cross-server-disabled = "&c没有开启跨服传送请求"
same-server-disabled = "&c没有开启同服传送请求"
request-sent = "&e请求已发送给 &6#target# #cancel#"
request-sent-all = "&e已向 &6#amount# &e名玩家发送请求（跳过 &6#skipped# &e名）"
request-sent-world = "&e已向当前世界的 &6#amount# &e名玩家发送请求（跳过 &6#skipped# &e名）"
request-sent-server = "&e已向本服的 &6#amount# &e名玩家发送请求（跳过 &6#skipped# &e名）"

# /tpaworld 专用：问不到自己在哪个世界（子服没装桥接 / 桥接超时）
world-unknown = "&c拿不到你所在的世界，子服装 VTpaBridge 了吗？请向腐竹反馈"
already-pending = "&e你已经在请求 &6#target# &e接受你的传送请求"
reverse-pending = "&6#target# &e已经给你发过请求了"
too-many-outgoing = "&e你挂着的请求太多了（最多 #max# 个），先处理掉几个"
target-disabled = "&6#target# &e关闭了传送请求"
target-busy = "&6#target# &e正在传送倒计时中，稍后重试"
self-busy = "&c你正在传送倒计时中，先等这趟传送完"
no-incoming = "&c你没有待处理的传送请求"
pick-one = "&c你有多个待处理请求，指定一个：&f#list#"
# 下面这些 *-self 是「做事的那个人」看到的，*-other 是「另一方」看到的
accepted-self = "&e已接受 &6#player# &e的传送请求"
accepted-other = "&6#player# &e接受了请求"
# 互相请求自动同意时用这两条（general.reverse-auto-accept = true）
#   mutual-accept-mover 发给「被传送的那个人」，#player# = 另一方
#   mutual-accept-dest  发给「另一方」，#player# = 被传送的那个人
mutual-accept-mover = "&a双方都同意了 —— &6#seconds# &a秒后传送到 &6#player# &a那里，请不要移动"
mutual-accept-dest = "&a双方都同意了 —— &6#player# &a会在 &6#seconds# &a秒后传送过来"
denied-self = "&e已拒绝 &6#player# &e的请求"
denied-other = "&6#target# &e拒绝了你的传送请求"
cancelled-self = "&e传送请求已取消"
cancelled-other = "&6#player# &e取消了发给你的传送请求"
cancelled-none = "&e你没有待处理的发出请求"
expired-self = "&6#player# &e发给你的请求已超时"
expired-other = "&e你发给 &6#target# &e的请求已超时"
offline-abort = "&e对方已经下线，传送请求作废"
countdown-moved = "&e由于您的移动，命令已取消"
countdown-moved-other = "&6#player# &e在倒计时中移动了，传送取消"
countdown-switch = ""  # &c你在传送倒计时中切换了服务器，传送取消
teleport-done = ""     # &e传送完成
teleport-failed = "&c传送失败：&7#reason#"
bridge-missing = "&c&7#server# &c这个服没有装 VTpaBridge，没法传送到具体位置"
bridge-missing-cross = "&c&7#server# &c这个服没有装 VTpaBridge，只能把你送到那个服的出生点"
toggle-off = "&e已关闭接收别人的传送请求"
toggle-on = "&e已恢复接收传送请求"
reloaded = "&e配置已重新加载"
reload-failed = "&c配置加载失败，用的还是旧配置。原因：#reason#"
switching = ""    # &7正在把你送到 &e#server#&7…

# ------------------------------------------------------------
# 与子服配套组件（VTpaBridge）的通信
#   channel              插件消息通道名，两边必须一致（改了要重启，且子服同步改）
#   missing              子服没装 VTpaBridge 时怎么办：
#                          deny   = 直接拒绝，提示装插件
#                          switch = 跨服的话只把人切到对方那个服（落到出生点），
#                                   同服的话因为啥也干不了，仍然拒绝
#   timeout-millis       问子服要坐标最多等多久（超时就当这个服没装桥接）
#   ping-interval-seconds 多久给各个有人的服发一次心跳，用来判断桥接在不在
# ------------------------------------------------------------
[bridge]
channel = "vtpa:main"
missing = "deny"
timeout-millis = 1200
ping-interval-seconds = 30

# ------------------------------------------------------------
# 命令名与别名
#   整个插件只有一个命令入口：/vtpa。所有功能都是它的子命令。
#   root = 主命令 /vtpa 的别名（想叫 /vt 之外的名字就改这里，写 [] 就只用 /vtpa）
#   下面每一行是「子命令主名 = [别名...]」，别名是 /vtpa 后面敲的那个词，
#   不参与 Velocity 的命令注册，所以跟别的插件撞名也没事。
# ------------------------------------------------------------
[commands]
root = ["vt"]
tpa = []
tpahere = ["tpask", "tphere"]
tpaccept = ["tpyes", "tpok"]
tpadeny = ["tpano", "tpno", "tpdeny"]
tpaall = ["tpall"]
tpacancel = ["tpcancel"]
tpatoggle = ["tptoggle"]
reload = ["rl"]
version = ["info", "ver"]

# ------------------------------------------------------------
# 顶层快捷命令：把子命令直接注册成 /tpa、/tpaccept 这种短命令
#   格式：命令名 = "子命令主名"（左边是要注册的命令名，右边是它干的事）
#
# ⚠️ 重点：代理上谁注册了命令谁说了算。这里注册了 /tpa，玩家敲 /tpa 就由代理处理，
#   根本不会转发到后端子服 —— 也就是说后端自己的 /tpa（CMI 的那个）会被彻底盖掉。
#   这是故意的：全服传送请求统一走 VTpa，顺带就跨服了。
#   子服里带前缀的写法（/cmi tpa）不受影响，被接管的只是短命令。
#
# ⚠️ 命令名在起服时注册 —— 改这里要重启代理（config 的其它部分仍可 /vtpa reload）。
# ⚠️ 名字被别的插件先占了会注册失败，起服日志里会有 WARN，插件其它功能不受影响。
# 不想接管哪个就把那一行删掉（或注释掉）。
# ------------------------------------------------------------
[shortcuts]
tpa = "tpa"
tpahere = "tpahere"
tpaccept = "tpaccept"
tpadeny = "tpadeny"
tpaall = "tpaall"
tpaworld = "tpaworld"
tpaserver = "tpaserver"
tpacancel = "tpacancel"
tpatoggle = "tpatoggle"

# ------------------------------------------------------------
# 杂项
#   auto-reload = 改了本文件不用敲命令，自己会在几秒内热重载（按修改时间判断）
#   log-to-console = 每次传送往控制台打一行（查纠纷用）
#   save-toggles = /tpatoggle 关掉的接收开关要不要存盘（重启代理后还在）
# ------------------------------------------------------------
[advanced]
auto-reload = false
auto-reload-interval-seconds = 3
log-to-console = true
save-toggles = true

# 输出传送日志
debug = false
